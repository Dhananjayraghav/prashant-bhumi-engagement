<!DOCTYPE html>

<head>

     domain below with your real address in these 4 places (og:url, og:image, twitter:image, canonical). -->

<meta property="og:description" content="Two hearts, one beautiful beginning. Join us on 6 December 2026.">
<meta property="og:url" content="https://dhananjayraghav.github.io/prashant-bhumi-engagement/">

<link rel="artifact-thumbnail" href="assets/og-image.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236b1530'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23c9a24a' stroke-width='2'/%3E%3Ctext x='32' y='41' font-family='Georgia' font-size='22' fill='%23e8d3a0' text-anchor='middle'%3EP%26amp;B%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/great-vibes-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>

<!-- Reusable SVG symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfa2"/><stop offset=".45" stop-color="#c9a24a"/><stop offset="1" stop-color="#8a6a25"/>
    </linearGradient>
    <radialGradient id="gFlame" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffc24a"/><stop offset="1" stop-color="#e2571c"/>
    </radialGradient>
  </defs>
  <symbol id="corner" viewBox="0 0 80 80">
    <path d="M4 76V20Q4 4 20 4h56" fill="none" stroke="url(#gGold)" stroke-width="2"/>
    <path d="M12 76V26Q12 12 26 12h50" fill="none" stroke="url(#gGold)" stroke-width="1"/>
    <path d="M20 20q12 2 14 14q-12-2-14-14zM20 20q2 12 14 14" fill="url(#gGold)" opacity=".9"/>
    <circle cx="40" cy="12" r="2" fill="#c9a24a"/><circle cx="12" cy="40" r="2" fill="#c9a24a"/>
    <path d="M48 12q6-6 12 0q-6 6-12 0zM12 48q-6 6 0 12q6-6 0-12z" fill="#c9a24a" opacity=".8"/>
  </symbol>
  <symbol id="lotus" viewBox="0 0 120 60">
    <path d="M60 4c10 12 10 30 0 46C50 34 50 16 60 4z" fill="#f1c9cf" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M60 50C46 40 34 26 30 12c14 4 26 18 30 38z" fill="#f4d6da" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M60 50C74 40 86 26 90 12c-14 4-26 18-30 38z" fill="#f4d6da" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M60 52C40 50 20 40 8 28c18 0 38 10 52 24z" fill="#f8e3e5" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M60 52C80 50 100 40 112 28c-18 0-38 10-52 24z" fill="#f8e3e5" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M30 56h60" stroke="#c9a24a" stroke-width="1.5"/>
  </symbol>
  <symbol id="diya" viewBox="0 0 60 60">
    <g class="flame"><path d="M30 6c6 8 8 14 0 24c-8-10-6-16 0-24z" fill="url(#gFlame)"/></g>
    <path d="M6 36h48c-2 12-12 18-24 18S8 48 6 36z" fill="url(#gGold)"/>
    <path d="M6 36q24 6 48 0" fill="none" stroke="#8a6a25" stroke-width="1.5"/>
    <circle cx="30" cy="44" r="2" fill="#6b1530"/>
  </symbol>
  <symbol id="divider" viewBox="0 0 240 20">
    <path d="M0 10h96M144 10h96" stroke="url(#gGold)" stroke-width="1"/>
    <path d="M120 2l8 8-8 8-8-8z" fill="url(#gGold)"/>
    <circle cx="104" cy="10" r="2.5" fill="#c9a24a"/><circle cx="136" cy="10" r="2.5" fill="#c9a24a"/>
  </symbol>
  <symbol id="lantern" viewBox="0 0 40 110">
    <path d="M20 0v26" stroke="#c9a24a" stroke-width="1"/>
    <path d="M12 26h16l4 8H8z" fill="url(#gGold)"/>
    <path d="M8 34h24q6 18 0 36H8q-6-18 0-36z" fill="#7a1a36" stroke="#c9a24a" stroke-width="1.2"/>
    <path d="M14 36v32M20 35v34M26 36v32" stroke="#c9a24a" stroke-width=".6" opacity=".7"/>
    <ellipse cx="20" cy="52" rx="7" ry="11" fill="#ffcf6b" opacity=".55"/>
    <path d="M8 70h24l-4 8H12z" fill="url(#gGold)"/>
    <path d="M20 78v10M16 88h8l-4 18z" fill="#c9a24a" stroke="#c9a24a"/>
  </symbol>
</svg>

<!-- Fixed effects layer -->
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ============ SCENE 1 : THE ROYAL ENVELOPE ============ -->
<section id="intro" class="scene" aria-label="Invitation envelope">
  <div class="palace" aria-hidden="true">
    <svg class="palace-far" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
      <path fill="#3a0a18" d="M0 400V250h80v-40q40-50 80 0v40h60V180q0-60 60-90q60 30 60 90v70h80v-60q50-70 100 0v60h80V150q0-80 80-120q80 40 80 120v100h80v-60q50-70 100 0v60h80V180q0-60 60-90q60 30 60 90v70h60v-40q40-50 80 0v40h80v150z"/>
    </svg>
    <svg class="palace-near" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
      <path fill="#2a0611" d="M0 300V200h1200v100z"/>
      <g fill="none" stroke="#c9a24a" stroke-opacity=".25" stroke-width="2">
        <path d="M60 300V230q50-70 100 0v70M260 300V230q50-70 100 0v70M460 300V220q140-110 280 0v80M840 300V230q50-70 100 0v70M1040 300V230q50-70 100 0v70"/>
      </g>
    </svg>
  </div>
  <svg class="lantern l1" aria-hidden="true"><use href="#lantern"/></svg>
  <svg class="lantern l2" aria-hidden="true"><use href="#lantern"/></svg>

  <div class="rays" aria-hidden="true"></div>
  <div class="intro-copy top">
    <p class="whisper">A special invitation awaits you…</p>
  </div>

  <button id="envelope" class="envelope" aria-label="Tap the seal to open your invitation">
    <span class="env-back"></span>
    <span class="env-glow"></span>
    <span class="letter">
      <span class="letter-in">
        <span class="l-orn">॥ शुभ सगाई ॥</span>
        <span class="l-names">Prashant <em>&</em> Bhumi</span>
        <span class="l-date">06 · 12 · 2026</span>
      </span>
    </span>
    <span class="env-front"></span>
    <span class="env-flap"><span class="flap-inner"></span></span>
    <span class="seal" aria-hidden="true">
      <span class="shock"></span><span class="shock s2"></span>
      <span class="shard a"></span><span class="shard b"></span><span class="shard c"></span><span class="shard d"></span>
      <span class="seal-mono">P<i>&</i>B</span>
    </span>
  </button>

  <div class="intro-copy bottom">
    <h1 class="names-script">Prashant <span>&</span> Bhumi</h1>
    <p class="sub">With love, we invite you to celebrate our beautiful beginning.</p>
    <p class="tap"><span class="pulse"></span>Tap the seal to open your invitation</p>
  </div>
  <button id="skip" class="skip" hidden>Skip ›</button>
</section>

<!-- ============ SCENE 2 : THE STORYBOOK ============ -->
<section id="story" class="scene" aria-label="Invitation booklet" hidden>
  <div class="palace dim" aria-hidden="true"></div>
  <svg class="lantern l1 small" aria-hidden="true"><use href="#lantern"/></svg>
  <svg class="lantern l2 small" aria-hidden="true"><use href="#lantern"/></svg>

  <div class="book-wrap">
    <div id="book" class="book" role="region" aria-roledescription="booklet" aria-live="polite"></div>
  </div>

  <nav class="book-nav" aria-label="Page navigation">
    <button id="prev" class="nav-btn" aria-label="Previous page">‹</button>
    <div id="dots" class="dots" role="tablist"></div>
    <button id="next" class="nav-btn" aria-label="Next page">›</button>
  </nav>
  <p class="swipe-hint" id="swipeHint">Swipe or tap › to turn the page</p>
</section>

<!-- Cinematic overlays -->
<div id="flash" aria-hidden="true"></div>
<div id="doors" aria-hidden="true" hidden>
  <div class="door-light"></div>
  <div class="door left"><span class="d-arch"></span><span class="d-panel"></span><span class="d-ring"></span></div>
  <div class="door right"><span class="d-arch"></span><span class="d-panel"></span><span class="d-ring"></span></div>
  <div class="door-top"><span>॥ शुभ स्वागतम् ॥</span></div>
</div>

<!-- Floating sound toggle -->
<button id="sound" class="sound" aria-label="Music on" aria-pressed="true" hidden>
  <svg viewBox="0 0 24 24" class="on"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <svg viewBox="0 0 24 24" class="off"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<!-- Sheet (share / contacts / calendar) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <button class="btn ghost" data-close>Close</button>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" data-lbclose aria-label="Close">×</button>
  <button class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <button class="lb-nav lb-next" aria-label="Next photo">›</button>
  <p class="lb-tip">Pinch or double-tap to zoom</p>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><div class="noscript"><h1>Prashant & Bhumi</h1><p>Engagement Ceremony · Sunday, 6 December 2026 · 4:00 PM<br>Shilpa Marriage Home, Pahasu Road, Khurja</p></div></noscript>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
